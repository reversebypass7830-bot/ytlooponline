# Place the map block inside the nginx http context. When this file is used as
# a complete /etc/nginx/nginx.conf include, keep the outer http block around it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream r_loop_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    # Media Library uploads can be large. The API validates its own upload
    # limit as well; this proxy limit prevents Nginx from rejecting valid
    # uploads before they reach Node.
    client_max_body_size 1g;

    location /api/ {
        proxy_pass http://r_loop_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_connect_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Serve the compiled React control room directly from Nginx.
    location / {
        root /var/www/r-loop-bypass/artifacts/live/dist/public;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
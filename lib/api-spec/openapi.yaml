    OwnerFeedbackListResponse:
      type: object
      properties:
        feedback:
          type: array
          items:
            $ref: "#/components/schemas/OwnerFeedback"
      required: [feedback]
    OwnerFeedbackResponse:
      type: object
      properties:
        feedback:
          $ref: "#/components/schemas/OwnerFeedback"
      required: [feedback]
    FeedbackImagePaths:
      type: array
      minItems: 1
      maxItems: 8
      items:
        type: string
        pattern: "^(?:/objects/|https://i\\.ibb\\.co/|/images/feedback-demo/)"
    CreateFeedbackInput:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 120
        channelName:
          type: string
          minLength: 2
          maxLength: 80
        channelUrl:
          type: string
          maxLength: 500
        imagePaths:
          $ref: "#/components/schemas/FeedbackImagePaths"
        pinned:
          type: boolean
      required: [title, channelName, channelUrl, imagePaths, pinned]
    FeedbackUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 120
        channelName:
          type: string
          minLength: 2
          maxLength: 80
        channelUrl:
          type: string
          maxLength: 500
        imagePaths:
          $ref: "#/components/schemas/FeedbackImagePaths"
        pinned:
          type: boolean
      required: [title, channelName, channelUrl, imagePaths, pinned]
    FeedbackImageUploadResponse:
      type: object
      properties:
        imageUrl:
          type: string
        contentType:
          type: string
        size:
          type: number
      required: [imageUrl, contentType, size]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StreamStartInput:
      type: object
      properties:
        streamId:
          type: string
          minLength: 1
        ingestUrl:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        videoSource:
          type: string
        videoSources:
          type: array
          items:
            type: string
            minLength: 1
        faceCategory:
          type: string
        faceSource:
          type: string
        faceSources:
          type: array
          items:
            type: string
        playbackSpeed:
          type: number
          minimum: 0.5
          maximum: 2
          default: 1
        quality:
          type: string
          enum: [4k, 1080p]
          default: 1080p
        aspectRatio:
          type: string
          enum: [shorts, full, square]
          default: full
        facePosition:
          type: string
          enum: [top-left, top-right, bottom-left, bottom-right, center]
          default: bottom-right
        faceScale:
          type: number
          minimum: 0.1
          maximum: 0.6
          default: 0.25
        durationMinutes:
          type: number
          minimum: 1
          maximum: 1440
        autoRestart:
          type: boolean
          default: false
        voiceAudio:
          type: boolean
          default: false
          description: Keeps a server-side microphone PCM input ready for live voice-over.
        liveAnimationSource:
          type: string
          description: Optional server-ready animation video to layer above the live playlist.
        liveAnimationX:
          type: number
          minimum: -48
          maximum: 48
          default: 0
        liveAnimationY:
          type: number
          minimum: -48
          maximum: 48
          default: 0
        liveAnimationScale:
          type: number
          minimum: 0.1
          maximum: 0.8
          default: 0.25
        composition:
          $ref: '#/components/schemas/StreamCompositionInput'
      required:
        - streamId
        - ingestUrl
        - category
    StreamCompositionInput:
      type: object
      description: Optional editor composition to apply directly while the live stream is encoded.
      properties:
        mainX:
          type: number
          minimum: -48
          maximum: 48
          default: 0
        mainY:
          type: number
          minimum: -48
          maximum: 48
          default: 0
        mainScale:
          type: number
          minimum: 0.5
          maximum: 2.5
          default: 1
        cropMode:
          type: string
          enum: [fit, crop]
          default: fit
        webcamSource:
          type: string

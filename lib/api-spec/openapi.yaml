        "200":
          description: Pricing templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPlanListResponse"
    post:
      operationId: createBillingPlan
      tags: [billing]
      summary: Create a subscription pricing template
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingPlanInput"
      responses:
        "201":
          description: Pricing template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPlanResponse"
  /owner/plans/{planId}:
    put:
      operationId: updateBillingPlan
      tags: [billing]
      summary: Update a subscription pricing template
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: planId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingPlanUpdate"
      responses:
        "200":
          description: Pricing template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPlanResponse"
        "404":
          description: Pricing template not found
  /owner/payment-settings:
    get:
      operationId: getOwnerPaymentSettings
      tags: [billing]
      summary: Get payment method, gateway environment, and credential status
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      responses:
        "200":
          description: Payment settings; secret values are never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSettings"
    put:
      operationId: updateOwnerPaymentSettings
      tags: [billing]
      summary: Set checkout method, UPI details, and Cashfree credentials
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentSettingsInput"
      responses:
        "200":
          description: Payment settings saved; secret values are never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSettings"
        "400":
          description: Invalid payment settings or incomplete Cashfree credential pair
        "409":
          description: Cashfree cannot be enabled until the selected environment is configured
  /owner/trial-settings:
    get:
      operationId: getOwnerTrialSettings
      tags: [billing]
      summary: Get the owner-configured trial duration and daily quotas
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      responses:
        "200":
          description: Trial configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialSettings"
    put:
      operationId: updateOwnerTrialSettings
      tags: [billing]
      summary: Set the duration and daily quotas used by both trial paths
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrialSettingsInput"
      responses:
        "200":
          description: Trial configuration saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialSettings"
        "400":
          description: Invalid trial configuration
  /owner/payment-requests:
    get:
      operationId: listOwnerPaymentRequests
      tags: [billing]
      summary: List manual UPI requests and Cashfree orders
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, failed]
      responses:
        "200":
          description: Payment requests for owner review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequestListResponse"
  /owner/payment-requests/{requestId}/review:
    post:
      operationId: reviewOwnerPaymentRequest
      tags: [billing]
      summary: Approve or reject a submitted UPI payment
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentReviewInput"
      responses:
        "200":
          description: Review saved; approved purchases activate account access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequestResponse"
        "404":
          description: Payment request not found
  /owner/users:
    get:
      operationId: listOwnerUsers
      tags: [accounts]
      summary: List account details for owner review
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      responses:
        "200":
          description: Account records with subscription history and live-start totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerUsersResponse"
        "401":
          description: Owner access is required
  /owner/users/{userId}/suspension:
    patch:
      operationId: updateOwnerUserSuspension
      tags: [accounts]
      summary: Suspend or restore a user account
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerUserSuspensionInput"
      responses:
        "200":
          description: Updated user account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerUserResponse"
        "400":
          description: Invalid suspension state
        "403":
          description: Owner accounts cannot be suspended
        "404":
          description: User account not found
  /owner/users/{userId}/service-pause:
    patch:
      operationId: updateOwnerUserServicePause
      tags: [accounts]
      summary: Pause or resume a user's service without suspending sign-in
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerUserServicePauseInput"
      responses:
        "200":
          description: Updated user service state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerUserResponse"
        "400":
          description: Invalid pause state
        "403":
          description: Owner accounts cannot be paused
        "404":
          description: User account not found
        "409":
          description: No unexpired service access is available to pause
  /owner/users/{userId}:
    delete:
      operationId: deleteOwnerUser
      tags: [accounts]
      summary: Delete a user account and its workspace data
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account, workspace, and uploaded media deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerUserDeleteResponse"
        "403":
          description: Owner accounts cannot be deleted
        "404":
          description: User account not found
  /owner/users/bulk-delete:
    post:
      operationId: bulkDeleteOwnerUsers
      tags: [accounts]
      summary: Delete multiple user accounts and their workspace data
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerUsersBulkDeleteInput"
      responses:
        "200":
          description: Per-user results for the requested deletions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerUsersBulkDeleteResponse"
        "400":
          description: Invalid user selection
  /owner/settings:
    get:
      operationId: getOwnerSettings
      tags: [accounts]
      summary: Get owner-configured support link
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      responses:
        "200":
          description: Owner settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSettings"
        "401":
          description: Owner access is required
    put:
      operationId: updateOwnerSettings
      tags: [accounts]
      summary: Save the support link shown to suspended accounts
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerSettingsInput"
      responses:
        "200":
          description: Owner settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSettings"
        "400":
          description: Support link must be a valid HTTP or HTTPS URL, or blank
components:
  parameters:
    OwnerPassword:
      name: X-Owner-Password
      in: header
      required: true
      schema:
        type: string
  schemas:
    PublicFeedback:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        channelName:
          type: string
        channelUrl:
          type: string
        imageUrl:
          type: string
        imageUrls:
          type: array
          items:
            type: string
        pinned:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, title, channelName, channelUrl, imageUrl, imageUrls, pinned, createdAt]
    OwnerFeedback:
      allOf:
        - $ref: "#/components/schemas/PublicFeedback"
        - type: object
          properties:
            imagePath:
              type: string
            imagePaths:
              type: array
              items:
                type: string
          required: [imagePath, imagePaths]
    PublicFeedbackListResponse:
      type: object
      properties:
        feedback:
          type: array
          items:
            $ref: "#/components/schemas/PublicFeedback"
      required: [feedback]
    OwnerFeedbackListResponse:
      type: object
      properties:
        feedback:
          type: array
          items:
            $ref: "#/components/schemas/OwnerFeedback"
      required: [feedback]
    OwnerFeedbackResponse:
      type: object
      properties:
        feedback:
          $ref: "#/components/schemas/OwnerFeedback"
      required: [feedback]
    FeedbackImagePaths:
      type: array
      minItems: 1
      maxItems: 8
      items:
        type: string
        pattern: "^(?:/objects/|https://i\\.ibb\\.co/|/images/feedback-demo/)"
    CreateFeedbackInput:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 120
        channelName:
          type: string
          minLength: 2
          maxLength: 80
        channelUrl:
          type: string
          maxLength: 500
        imagePaths:
          $ref: "#/components/schemas/FeedbackImagePaths"
        pinned:
          type: boolean
      required: [title, channelName, channelUrl, imagePaths, pinned]
    FeedbackUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 120
        channelName:
          type: string
          minLength: 2
          maxLength: 80
        channelUrl:
          type: string
          maxLength: 500
        imagePaths:
          $ref: "#/components/schemas/FeedbackImagePaths"
        pinned:
          type: boolean
      required: [title, channelName, channelUrl, imagePaths, pinned]
    FeedbackImageUploadResponse:
      type: object
      properties:
        imageUrl:
          type: string
        contentType:
          type: string
        size:
          type: number
      required: [imageUrl, contentType, size]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StreamStartInput:
      type: object
      properties:
        streamId:
          type: string
          minLength: 1
        ingestUrl:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        videoSource:
          type: string
        videoSources:
          type: array
          items:
            type: string
            minLength: 1
        faceCategory:
          type: string
        faceSource:
          type: string
        faceSources:
          type: array
          items:
            type: string
        playbackSpeed:
          type: number
          minimum: 0.5
          maximum: 2
          default: 1
        quality:
          type: string
          enum: [4k, 1080p]
          default: 1080p
        aspectRatio:
          type: string
          enum: [shorts, full, square]
          default: full
        facePosition:
          type: string
          enum: [top-left, top-right, bottom-left, bottom-right, center]
          default: bottom-right
        faceScale:
          type: number
          minimum: 0.1
          maximum: 0.6
          default: 0.25
        durationMinutes:
          type: number
          minimum: 1
          maximum: 1440
        autoRestart:
          type: boolean
          default: false
        voiceAudio:
          type: boolean
          default: false
          description: Keeps a server-side microphone PCM input ready for live voice-over.
        liveAnimationSource:
          type: string
          description: Optional server-ready animation video to layer above the live playlist.
        liveAnimationX:
          type: number
          minimum: -48
          maximum: 48
          default: 0
        liveAnimationY:
          type: number
          minimum: -48
          maximum: 48
          default: 0
        liveAnimationScale:
          type: number
          minimum: 0.1
          maximum: 0.8
          default: 0.25
        composition:
          $ref: '#/components/schemas/StreamCompositionInput'
      required:
        - streamId
        - ingestUrl
        - category
    StreamCompositionInput:
      type: object
      description: Optional editor composition to apply directly while the live stream is encoded.
      properties:
        mainX:
          type: number
          minimum: -48
          maximum: 48
          default: 0
        mainY:
          type: number
          minimum: -48
          maximum: 48
          default: 0
        mainScale:
          type: number
          minimum: 0.5
          maximum: 2.5
          default: 1
        cropMode:
          type: string
          enum: [fit, crop]
          default: fit
        webcamSource:
          type: string
        webcamX:
          type: number
          minimum: -48
          maximum: 48
          default: 0
        webcamY:
          type: number
          minimum: -48
          maximum: 48
          default: 0
        webcamScale:
          type: number
          minimum: 0.1
          maximum: 0.8
          default: 0.25
        animationSource:
          type: string
        animationX:
          type: number
          minimum: -48
          maximum: 48
          default: 0
        animationY:
          type: number
          minimum: -48
          maximum: 48
          default: 0
        animationScale:
          type: number
          minimum: 0.1
          maximum: 0.8
          default: 0.25
        animationLayers:
          type: array
          description: Multiple animation overlays that play together in the editor composition.
          items:
            type: object
            required: [source]
            properties:
              source:
                type: string
              x:
                type: number
                minimum: -48
                maximum: 48
                default: 0
              y:
                type: number
                minimum: -48
                maximum: 48
                default: 0
              scale:
                type: number
                minimum: 0.1
                maximum: 0.8
                default: 0.25
        logoSource:
          type: string
        logoPosition:
          type: string
          enum: [top-left, top-right, bottom-left, bottom-right]
          default: bottom-right
        logoScale:
          type: number
          minimum: 0.1
          maximum: 0.6
          default: 0.25
        animationPreset:
          type: string
          enum: [none, subscribe, like, follow]
          default: none
        comingSoon:
          type: boolean
          default: false
          description: Show a COMING SOON lower-third in the live composition.
        brightness:
          type: number
          minimum: -1
          maximum: 1
          default: 0
        contrast:
          type: number
          minimum: 0.5
          maximum: 1.8
          default: 1
        saturation:
          type: number
          minimum: 0
          maximum: 2
          default: 1
        hue:
          type: number
          minimum: -180
          maximum: 180
          default: 0
        chromaKeyBySource:
          type: object
          additionalProperties:
            type: object
            properties:
              enabled:
                type: boolean
              color:
                type: string
                pattern: "^#?[0-9a-fA-F]{6}$"
              similarity:
                type: number
                minimum: 0.05
                maximum: 0.95
              blend:
                type: number
                minimum: 0
                maximum: 0.5
        chromaKeyDurations:
          type: object
          additionalProperties:
            type: number
            minimum: 0
        chromaKeyByLayer:
          type: object
          additionalProperties:
            type: object
            properties:
              enabled:
                type: boolean
              color:
                type: string
                pattern: "^#?[0-9a-fA-F]{6}$"
              similarity:
                type: number
                minimum: 0.05
                maximum: 0.95
              blend:
                type: number
                minimum: 0
                maximum: 0.5
        chromaKeyEnabled:
          type: boolean
          default: false
        chromaKeyTarget:
          type: string
          enum: [main, webcam, animation]
          default: webcam
        chromaKeyColor:
          type: string
          default: '#00ff00'
        chromaSimilarity:
          type: number
          minimum: 0.1
          maximum: 0.9
          default: 0.32
        chromaBlend:
          type: number
          minimum: 0
          maximum: 0.35
          default: 0.08
    StreamStopInput:
      type: object
      properties:
        streamId:
          type: string

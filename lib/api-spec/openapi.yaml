          type: number
          minimum: -48
          maximum: 48
          default: 0
        animationY:
          type: number
          minimum: -48
          maximum: 48
          default: 0
        animationScale:
          type: number
          minimum: 0.1
          maximum: 0.8
          default: 0.25
        animationLayers:
          type: array

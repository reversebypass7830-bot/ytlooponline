openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: feedback
    description: Public channel showcases managed by the owner
  - name: streaming
    description: Live stream control operations
  - name: media
    description: Local media upload operations
  - name: licenses
    description: License access and workspace operations
  - name: billing
    description: Manual UPI payments, subscription pricing, and owner review
paths:
  /public/feedback:
    get:
      operationId: listPublicFeedback
      tags: [feedback]
      summary: List published channel feedback
      responses:
        "200":
          description: All public feedback entries, with pinned entries first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFeedbackListResponse"
  /public/feedback/{feedbackId}/images/{imageIndex}:
    get:
      operationId: getPublicFeedbackImageByIndex
      tags: [feedback]
      summary: Serve an image from a published feedback entry
      parameters:
        - name: feedbackId
          in: path
          required: true
          schema:
            type: string
        - name: imageIndex
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9]+$"
      responses:
        "200":
          description: Feedback image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Feedback image not found
  /public/feedback/{feedbackId}/image:
    get:
      operationId: getPublicFeedbackImage
      tags: [feedback]
      summary: Serve a published feedback image
      parameters:
        - name: feedbackId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Feedback image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Feedback image not found
  /owner/feedback:
    get:
      operationId: listOwnerFeedback
      tags: [feedback]
      summary: List feedback entries in the owner console
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      responses:
        "200":
          description: Feedback entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerFeedbackListResponse"
        "401":
          description: Owner access is required
    post:
      operationId: createOwnerFeedback
      tags: [feedback]
      summary: Add a channel feedback entry
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackInput"
      responses:
        "201":
          description: Feedback entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerFeedbackResponse"
        "400":
          description: Invalid feedback details
        "409":
          description: The four homepage feature slots are already full
        "401":
          description: Owner access is required
  /owner/feedback/images:
    post:
      operationId: uploadOwnerFeedbackImage
      tags: [feedback]
      summary: Upload a feedback image to ImgBB
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: X-Feedback-Filename
          in: header
          required: false
          schema:
            type: string
            maxLength: 560
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: ImgBB image URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackImageUploadResponse"
        "400":
          description: Invalid image type or size
        "401":
          description: Owner access is required
  /owner/feedback/{feedbackId}:
    patch:
      operationId: updateOwnerFeedback
      tags: [feedback]
      summary: Update a channel feedback entry and its homepage pin
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: feedbackId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackUpdate"
      responses:
        "200":
          description: Feedback entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerFeedbackResponse"
        "400":
          description: Invalid feedback details
        "401":
          description: Owner access is required
        "404":
          description: Feedback entry not found
        "409":
          description: The four homepage feature slots are already full
    delete:
      operationId: deleteOwnerFeedback
      tags: [feedback]
      summary: Remove a channel feedback entry
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: feedbackId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Feedback entry deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]
        "401":
          description: Owner access is required
        "404":
          description: Feedback entry not found
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stream/start:
    post:
      operationId: startStream
      tags: [streaming]
      summary: Start a live stream
      description: Starts FFmpeg and sends a selected local category video to the supplied ingest URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamStartInput"
      responses:
        "202":
          description: Stream process accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamControlResponse"
        "400":
          description: Invalid stream configuration
        "409":
          description: Stream is already running
        "500":
          description: Stream process could not start
  /stream/stop:
    post:
      operationId: stopStream
      tags: [streaming]
      summary: Stop a live stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamStopInput"
      responses:
        "200":
          description: Stream stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamControlResponse"
        "404":
          description: Stream is not running
  /stream/update:
    post:
      operationId: updateStream
      tags: [streaming]
      summary: Update the playlist of a running stream
      description: Rebuilds the active FFmpeg playlist so videos added to or removed from a category take effect while streaming.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamStartInput"
      responses:
        "202":
          description: Stream playlist update accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamControlResponse"
        "400":
          description: Invalid stream playlist
        "404":
          description: Stream is not running
  /stream/status/{streamId}:
    get:
      operationId: getStreamStatus
      tags: [streaming]
      summary: Get stream process status
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamControlResponse"
  /media/upload:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload a local video for server-side streaming
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          video/*:
            schema:
              type: string
              format: binary
      parameters:
        - name: X-File-Name
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "201":
          description: Media is ready for streaming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"
        "400":
          description: Invalid media upload
  /media/files/{fileId}:
    get:
      operationId: getMediaFile
      tags: [media]
      summary: Serve an uploaded local media file
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Media file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Media file not found
    delete:
      operationId: deleteMediaFile
      tags: [media]
      summary: Delete an uploaded local media file
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Media file deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaDeleteResponse"
        "400":
          description: Invalid media file id
  /media/files:
    get:
      operationId: listMediaFiles
      tags: [media]
      summary: List media files stored on the server
      parameters:
        - name: licenseId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Stored media files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFileListResponse"
        "400":
          description: A license or shared-library scope is required
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
  /media/included-folders:
    get:
      operationId: listIncludedAnimationFolders
      tags: [media]
      summary: List the shared Included Animations folder tree
      responses:
        "200":
          description: Shared folder tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncludedFolderTreeResponse"
  /owner/included-folders:
    get:
      operationId: listIncludedFolders
      tags: [media]
      summary: List the owner's shared Included Animations folders
      parameters:
        - name: X-Owner-Password
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared folder tree and included videos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncludedFoldersResponse"
        "401":
          description: Owner access is required
    post:
      operationId: createIncludedFolder
      tags: [media]
      summary: Create an owner's shared Included Animations folder
      parameters:
        - name: X-Owner-Password
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncludedFolderInput"
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncludedFolderRecord"
        "400":
          description: Invalid folder name
        "401":
          description: Owner access is required
    patch:
      operationId: renameIncludedFolder
      tags: [media]
      summary: Rename or move an owner's shared folder
      parameters:
        - name: X-Owner-Password
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncludedFolderMoveInput"
      responses:
        "200":
          description: Folder moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncludedFolderMoveResponse"
        "400":
          description: Invalid folder move
        "401":
          description: Owner access is required
    delete:
      operationId: deleteIncludedFolder
      tags: [media]
      summary: Delete an owner's shared folder and its videos
      parameters:
        - name: X-Owner-Password
          in: header
          required: true
          schema:
            type: string
        - name: folderName
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Folder deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncludedFolderDeleteResponse"
        "400":
          description: The root folder cannot be deleted
        "401":
          description: Owner access is required
  /owner/included-files/{fileId}:
    patch:
      operationId: moveIncludedFile
      tags: [media]
      summary: Move an included video to another shared folder
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
        - name: X-Owner-Password
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncludedFileMoveInput"
      responses:
        "200":
          description: Video moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncludedFileMoveResponse"
        "401":
          description: Owner access is required
        "404":
          description: Included video not found
  /media/files/{fileId}/trim:
    post:
      operationId: trimMediaFile
      tags: [media]
      summary: Create a trimmed MP4 clip from a local media file
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrimMediaInput"
      responses:
        "201":
          description: Trimmed media clip is ready for streaming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaTrimResponse"
        "400":
          description: Invalid trim range or media file
  /media/compose:
    post:
      operationId: composeMedia
      tags: [media]
      summary: Merge and loop server media into an edited video
      parameters:
        - name: X-License-Id
          in: header
          required: false
          schema:
            type: string
        - name: X-License-Name
          in: header
          required: false
          schema:
            type: string
        - name: X-Folder-Name
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeMediaInput"
      responses:
        "201":
          description: Edited media is ready for streaming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaTrimResponse"
        "400":
          description: Invalid media selection or FFmpeg compose failure
  /media/youtube-download:
    post:
      operationId: downloadYoutubeVideo
      tags: [media]
      summary: Download a YouTube video at the best available quality
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YoutubeDownloadInput"
      responses:
        "201":
          description: YouTube video downloaded and ready for streaming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeDownloadResponse"
        "400":
          description: Invalid URL or download failure
  /media/youtube-download/jobs:
    post:
      operationId: startYoutubeDownloadJob
      tags: [media]
      summary: Start an asynchronous YouTube download job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YoutubeDownloadInput"
      responses:
        "202":
          description: Download job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeDownloadJobAccepted"
        "400":
          description: Invalid URL or download request
  /media/youtube-download/jobs/{jobId}:
    get:
      operationId: getYoutubeDownloadJob
      tags: [media]
      summary: Get asynchronous YouTube download job status
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current download job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeDownloadJob"
        "404":
          description: Download job not found
  /media/youtube-formats:
    post:
      operationId: getYoutubeFormats
      tags: [media]
      summary: List available YouTube video qualities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YoutubeFormatsInput"
      responses:
        "200":
          description: Available video qualities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeFormatsResponse"
        "400":
          description: Invalid URL or format lookup failure
  /media/youtube-channel-links:
    post:
      operationId: extractYoutubeChannelLinks
      tags: [media]
      summary: Extract public video links from a YouTube channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractYoutubeChannelLinksInput"
      responses:
        "200":
          description: Channel video links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeChannelLinksResponse"
        "400":
          description: Invalid channel URL or extraction failure
  /licenses:
    get:
      operationId: listLicenses
      tags: [licenses]
      summary: List licenses for the owner
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      responses:
        "200":
          description: License list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseListResponse"
        "401":
          description: Owner password is incorrect
    post:
      operationId: createLicense
      tags: [licenses]
      summary: Create a license
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLicenseInput"
      responses:
        "201":
          description: License created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseAccess"
        "401":
          description: Owner password is incorrect
  /licenses/{licenseId}:
    delete:
      operationId: deleteLicense
      tags: [licenses]
      summary: Delete a license and its workspace data
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: licenseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: License deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteLicenseResult"
        "401":
          description: Owner password is incorrect
  /licenses/{licenseId}/renew:
    post:
      operationId: renewLicense
      tags: [licenses]
      summary: Renew a license as the owner
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: licenseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewLicenseInput"
      responses:
        "200":
          description: License renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseAccess"
        "401":
          description: Owner password is incorrect
  /owner/vidkraken-keys:
    get:
      operationId: listVidKrakenTokens
      tags: [licenses]
      summary: List the owner's VidKraken token pool without exposing token values
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      responses:
        "200":
          description: VidKraken token statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VidKrakenTokenListResponse"
        "401":
          description: Owner password is incorrect
    post:
      operationId: addVidKrakenToken
      tags: [licenses]
      summary: Add a VidKraken token to the owner's rotation pool
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddVidKrakenTokenInput"
      responses:
        "201":
          description: Token added; the token value is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VidKrakenTokenMutationResponse"
        "400":
          description: Invalid or duplicate token
        "401":
          description: Owner password is incorrect
  /owner/vidkraken-keys/{tokenKey}:
    delete:
      operationId: deleteVidKrakenToken
      tags: [licenses]
      summary: Remove a VidKraken token from the owner's rotation pool
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: tokenKey
          in: path
          required: true
          schema:
            type: string
            pattern: "^TOKEN(_[0-9]+)?$"
      responses:
        "200":
          description: Token removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VidKrakenTokenMutationResponse"
        "400":
          description: Invalid token key
        "401":
          description: Owner password is incorrect
  /licenses/validate:
    post:
      operationId: validateLicense
      tags: [licenses]
      summary: Validate a license key for a browser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseClientInput"
      responses:
        "200":
          description: License is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseAccess"
        "403":
          description: License is invalid or expired
  /licenses/workspace/get:
    post:
      operationId: getLicenseWorkspace
      tags: [licenses]
      summary: Load a browser-specific license workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseClientInput"
      responses:
        "200":
          description: Workspace loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseWorkspaceResponse"
        "403":
          description: License is invalid or expired
  /licenses/workspace:
    put:
      operationId: saveLicenseWorkspace
      tags: [licenses]
      summary: Save a browser-specific license workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveLicenseWorkspaceInput"
      responses:
        "200":
          description: Workspace saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSaveResponse"
        "403":
          description: License is invalid or expired
  /licenses/renew:
    post:
      operationId: renewLicenseForUser
      tags: [licenses]
      summary: Renew a license from the user side
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewLicenseForUserInput"
      responses:
        "200":
          description: License renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseAccess"
        "404":
          description: License key not found
  /account/payment-quote:
    post:
      operationId: quoteAccountPayment
      tags: [billing]
      summary: Calculate a subscription price before payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPaymentQuoteInput"
      responses:
        "200":
          description: Server-calculated payment quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPaymentQuote"
        "400":
          description: Invalid plan or requested entitlements
  /account/payment-requests:
    get:
      operationId: listAccountPaymentRequests
      tags: [billing]
      summary: List the signed-in user's manual payment requests
      responses:
        "200":
          description: User payment requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequestListResponse"
    post:
      operationId: createAccountPaymentRequest
      tags: [billing]
      summary: Submit a UPI transaction reference for owner review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPaymentRequestInput"
      responses:
        "201":
          description: Payment request submitted; access remains unchanged until approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequestResponse"
        "400":
          description: Invalid transaction reference or payment details
  /account/payment-proof/upload-url:
    post:
      operationId: createAccountPaymentProofUploadUrl
      tags: [billing]
      summary: Prepare a private payment-proof image upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentAssetUploadUrlInput"
      responses:
        "200":
          description: Signed upload URL and private object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentAssetUploadUrl"
        "400":
          description: Unsupported image or file size
  /owner/plans:
    get:
      operationId: listBillingPlans
      tags: [billing]
      summary: List subscription pricing templates
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      responses:
        "200":
          description: Pricing templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPlanListResponse"
    post:
      operationId: createBillingPlan
      tags: [billing]
      summary: Create a subscription pricing template
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingPlanInput"
      responses:
        "201":
          description: Pricing template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPlanResponse"
  /owner/plans/{planId}:
    put:
      operationId: updateBillingPlan
      tags: [billing]
      summary: Update a subscription pricing template
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: planId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingPlanUpdate"
      responses:
        "200":
          description: Pricing template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPlanResponse"
        "404":
          description: Pricing template not found
  /owner/payment-settings:
    get:
      operationId: getOwnerPaymentSettings
      tags: [billing]
      summary: Get the UPI payee details used for checkout
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      responses:
        "200":
          description: UPI payment settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSettings"
    put:
      operationId: updateOwnerPaymentSettings
      tags: [billing]
      summary: Set the UPI ID and payee name displayed to customers
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentSettingsInput"
      responses:
        "200":
          description: UPI payment settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSettings"
  /owner/payment-requests:
    get:
      operationId: listOwnerPaymentRequests
      tags: [billing]
      summary: List manual UPI requests awaiting or completed review
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Payment requests for owner review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequestListResponse"
  /owner/payment-requests/{requestId}/review:
    post:
      operationId: reviewOwnerPaymentRequest
      tags: [billing]
      summary: Approve or reject a submitted UPI payment
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentReviewInput"
      responses:
        "200":
          description: Review saved; approved purchases activate account access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequestResponse"
        "404":
          description: Payment request not found
components:

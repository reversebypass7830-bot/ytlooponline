openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: streaming
    description: Live stream control operations
  - name: media
    description: Local media upload operations
  - name: licenses
    description: License access and workspace operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stream/start:
    post:
      operationId: startStream
      tags: [streaming]
      summary: Start a live stream
      description: Starts FFmpeg and sends a selected local category video to the supplied ingest URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamStartInput"
      responses:
        "202":
          description: Stream process accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamControlResponse"
        "400":
          description: Invalid stream configuration
        "409":
          description: Stream is already running
        "500":
          description: Stream process could not start
  /stream/stop:
    post:
      operationId: stopStream
      tags: [streaming]
      summary: Stop a live stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamStopInput"
      responses:
        "200":
          description: Stream stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamControlResponse"
        "404":
          description: Stream is not running
  /stream/update:
    post:
      operationId: updateStream
      tags: [streaming]
      summary: Update the playlist of a running stream
      description: Rebuilds the active FFmpeg playlist so videos added to or removed from a category take effect while streaming.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamStartInput"
      responses:
        "202":
          description: Stream playlist update accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamControlResponse"
        "400":
          description: Invalid stream playlist
        "404":
          description: Stream is not running
  /stream/status/{streamId}:
    get:
      operationId: getStreamStatus
      tags: [streaming]
      summary: Get stream process status
      parameters:
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamControlResponse"
  /media/upload:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload a local video for server-side streaming
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          video/*:
            schema:
              type: string
              format: binary
      parameters:
        - name: X-File-Name
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "201":
          description: Media is ready for streaming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"
        "400":
          description: Invalid media upload
  /media/files/{fileId}:
    get:
      operationId: getMediaFile
      tags: [media]
      summary: Serve an uploaded local media file
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Media file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Media file not found
    delete:
      operationId: deleteMediaFile
      tags: [media]
      summary: Delete an uploaded local media file
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Media file deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaDeleteResponse"
        "400":
          description: Invalid media file id
  /media/files:
    get:
      operationId: listMediaFiles
      tags: [media]
      summary: List media files stored on the server
      parameters:
        - name: licenseId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Stored media files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFileListResponse"
  /owner/included-folders:
    get:
      operationId: listIncludedFolders
      tags: [media]
      summary: List the owner's shared Included Animations folders
      parameters:
        - name: X-Owner-Password
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared folder tree and included videos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncludedFoldersResponse"
        "401":
          description: Owner access is required
    post:
      operationId: createIncludedFolder
      tags: [media]
      summary: Create an owner's shared Included Animations folder
      parameters:
        - name: X-Owner-Password
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncludedFolderInput"
      responses:
        "201":
          description: Folder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncludedFolderRecord"
        "400":
          description: Invalid folder name
        "401":
          description: Owner access is required
    patch:
      operationId: renameIncludedFolder
      tags: [media]
      summary: Rename or move an owner's shared folder
      parameters:
        - name: X-Owner-Password
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncludedFolderMoveInput"
      responses:
        "200":
          description: Folder moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncludedFolderMoveResponse"
        "400":
          description: Invalid folder move
        "401":
          description: Owner access is required
    delete:
      operationId: deleteIncludedFolder
      tags: [media]
      summary: Delete an owner's shared folder and its videos
      parameters:
        - name: X-Owner-Password
          in: header
          required: true
          schema:
            type: string
        - name: folderName
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Folder deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncludedFolderDeleteResponse"
        "400":
          description: The root folder cannot be deleted
        "401":
          description: Owner access is required
  /owner/included-files/{fileId}:
    patch:
      operationId: moveIncludedFile
      tags: [media]
      summary: Move an included video to another shared folder
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
        - name: X-Owner-Password
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncludedFileMoveInput"
      responses:
        "200":
          description: Video moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncludedFileMoveResponse"
        "401":
          description: Owner access is required
        "404":
          description: Included video not found
  /media/files/{fileId}/trim:
    post:
      operationId: trimMediaFile
      tags: [media]
      summary: Create a trimmed MP4 clip from a local media file
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrimMediaInput"
      responses:
        "201":
          description: Trimmed media clip is ready for streaming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaTrimResponse"
        "400":
          description: Invalid trim range or media file
  /media/compose:
    post:
      operationId: composeMedia
      tags: [media]
      summary: Merge and loop server media into an edited video
      parameters:
        - name: X-License-Id
          in: header
          required: false
          schema:
            type: string
        - name: X-License-Name
          in: header
          required: false
          schema:
            type: string
        - name: X-Folder-Name
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeMediaInput"
      responses:
        "201":
          description: Edited media is ready for streaming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaTrimResponse"
        "400":
          description: Invalid media selection or FFmpeg compose failure
  /media/youtube-download:
    post:
      operationId: downloadYoutubeVideo
      tags: [media]
      summary: Download a YouTube video at the best available quality
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YoutubeDownloadInput"
      responses:
        "201":
          description: YouTube video downloaded and ready for streaming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeDownloadResponse"
        "400":
          description: Invalid URL or download failure
  /media/youtube-download/jobs:
    post:
      operationId: startYoutubeDownloadJob
      tags: [media]
      summary: Start an asynchronous YouTube download job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YoutubeDownloadInput"
      responses:
        "202":
          description: Download job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeDownloadJobAccepted"
        "400":
          description: Invalid URL or download request
  /media/youtube-download/jobs/{jobId}:
    get:
      operationId: getYoutubeDownloadJob
      tags: [media]
      summary: Get asynchronous YouTube download job status
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current download job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeDownloadJob"
        "404":
          description: Download job not found
  /media/youtube-formats:
    post:
      operationId: getYoutubeFormats
      tags: [media]
      summary: List available YouTube video qualities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YoutubeFormatsInput"
      responses:
        "200":
          description: Available video qualities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeFormatsResponse"
        "400":
          description: Invalid URL or format lookup failure
  /media/youtube-channel-links:
    post:
      operationId: extractYoutubeChannelLinks
      tags: [media]
      summary: Extract public video links from a YouTube channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractYoutubeChannelLinksInput"
      responses:
        "200":
          description: Channel video links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YoutubeChannelLinksResponse"
        "400":
          description: Invalid channel URL or extraction failure
  /licenses:
    get:
      operationId: listLicenses
      tags: [licenses]
      summary: List licenses for the owner
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      responses:
        "200":
          description: License list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseListResponse"
        "401":
          description: Owner password is incorrect
    post:
      operationId: createLicense
      tags: [licenses]
      summary: Create a license
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLicenseInput"
      responses:
        "201":
          description: License created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseAccess"
        "401":
          description: Owner password is incorrect
  /licenses/{licenseId}:
    delete:
      operationId: deleteLicense
      tags: [licenses]
      summary: Delete a license and its workspace data
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: licenseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: License deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteLicenseResult"
        "401":
          description: Owner password is incorrect
  /licenses/{licenseId}/renew:
    post:
      operationId: renewLicense
      tags: [licenses]
      summary: Renew a license as the owner
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: licenseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewLicenseInput"
      responses:
        "200":
          description: License renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseAccess"
        "401":
          description: Owner password is incorrect
  /owner/vidkraken-keys:
    get:
      operationId: listVidKrakenTokens
      tags: [licenses]
      summary: List the owner's VidKraken token pool without exposing token values
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      responses:
        "200":
          description: VidKraken token statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VidKrakenTokenListResponse"
        "401":
          description: Owner password is incorrect
    post:
      operationId: addVidKrakenToken
      tags: [licenses]
      summary: Add a VidKraken token to the owner's rotation pool
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddVidKrakenTokenInput"
      responses:
        "201":
          description: Token added; the token value is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VidKrakenTokenMutationResponse"
        "400":
          description: Invalid or duplicate token
        "401":
          description: Owner password is incorrect
  /owner/vidkraken-keys/{tokenKey}:
    delete:
      operationId: deleteVidKrakenToken
      tags: [licenses]
      summary: Remove a VidKraken token from the owner's rotation pool
      parameters:
        - $ref: "#/components/parameters/OwnerPassword"
        - name: tokenKey
          in: path
          required: true
          schema:
            type: string
            pattern: "^TOKEN(_[0-9]+)?$"
      responses:
        "200":
          description: Token removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VidKrakenTokenMutationResponse"
        "400":
          description: Invalid token key
        "401":
          description: Owner password is incorrect
  /licenses/validate:
    post:
      operationId: validateLicense
      tags: [licenses]
      summary: Validate a license key for a browser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseClientInput"
      responses:
        "200":
          description: License is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseAccess"
        "403":
          description: License is invalid or expired
  /licenses/workspace/get:
    post:
      operationId: getLicenseWorkspace
      tags: [licenses]
      summary: Load a browser-specific license workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseClientInput"
      responses:
        "200":
          description: Workspace loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseWorkspaceResponse"
        "403":
          description: License is invalid or expired
  /licenses/workspace:
    put:
      operationId: saveLicenseWorkspace
      tags: [licenses]
      summary: Save a browser-specific license workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveLicenseWorkspaceInput"
      responses:
        "200":
          description: Workspace saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSaveResponse"
        "403":
          description: License is invalid or expired
  /licenses/renew:
    post:
      operationId: renewLicenseForUser
      tags: [licenses]
      summary: Renew a license from the user side
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewLicenseForUserInput"
      responses:
        "200":
          description: License renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseAccess"
        "404":
          description: License key not found
components:
  parameters:
    OwnerPassword:
      name: X-Owner-Password
      in: header
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StreamStartInput:
      type: object
      properties:
        streamId:
          type: string
          minLength: 1
        ingestUrl:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        videoSource:
          type: string
        videoSources:
          type: array
          items:
            type: string
            minLength: 1
        faceCategory:
          type: string
        faceSource:
          type: string
        faceSources:
          type: array
          items:
            type: string
        playbackSpeed:
          type: number
          minimum: 0.5
          maximum: 2
          default: 1
        quality:
          type: string
          enum: [4k, 1080p]
          default: 4k
        aspectRatio:
          type: string
          enum: [shorts, full, square]
          default: full
        facePosition:
          type: string
          enum: [top-left, top-right, bottom-left, bottom-right, center]
          default: bottom-right
        faceScale:
          type: number
          minimum: 0.1
          maximum: 0.6
          default: 0.25
        durationMinutes:
          type: number
          minimum: 1
          maximum: 1440
        autoRestart:
          type: boolean
          default: false
      required:
        - streamId
        - ingestUrl
        - category
    StreamStopInput:
      type: object
      properties:
        streamId:
          type: string
          minLength: 1
      required:
        - streamId
    StreamControlResponse:
      type: object
      properties:
        streamId:
          type: string
        status:
          type: string
          enum: [running, stopped, failed]
        message:
          type: string
        pid:
          type: ["number", "null"]
      required:
        - streamId
        - status
        - message
        - pid
    MediaUploadResponse:
      type: object
      properties:
        fileId:
          type: string
        filename:
          type: string
        sourcePath:
          type: string
        playbackUrl:
          type: string
      required:
        - fileId
        - filename
        - sourcePath
        - playbackUrl
    MediaDeleteResponse:
      type: object
      properties:
        fileId:
          type: string
        deleted:
          type: boolean
      required:
        - fileId
        - deleted
    MediaFileRecord:
      type: object
      properties:
        fileId:
          type: string
        filename:
          type: string
        sourcePath:
          type: string
        playbackUrl:
          type: string
        title:
          type: string
        duration:
          type: string
        licenseId:
          type: string
        licenseName:
          type: string
        folderName:
          type: string
        quality:
          type: string
        createdAt:
          type: string
          format: date-time
        sizeBytes:
          type: number
      required:
        - fileId
        - filename
        - sourcePath
        - playbackUrl
        - title
        - duration
        - licenseId
        - licenseName
        - folderName
        - quality
        - createdAt
        - sizeBytes
    MediaFileListResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/MediaFileRecord"
      required:
        - files
    IncludedFolderRecord:
      type: object
      properties:
        path:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - path
        - createdAt
    IncludedFoldersResponse:
      type: object
      properties:
        root:
          type: string
        folders:
          type: array
          items:
            $ref: "#/components/schemas/IncludedFolderRecord"
        files:
          type: array
          items:
            $ref: "#/components/schemas/MediaFileRecord"
      required:
        - root
        - folders
        - files
    IncludedFolderInput:
      type: object
      properties:
        folderName:
          type: string
          minLength: 1
      required:
        - folderName
    IncludedFolderMoveInput:
      type: object
      properties:
        from:
          type: string
          minLength: 1
        to:
          type: string
          minLength: 1
      required:
        - from
        - to
    IncludedFolderMoveResponse:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
      required:
        - from
        - to
    IncludedFolderDeleteResponse:
      type: object
      properties:
        path:
          type: string
        deleted:
          type: number
      required:
        - path
        - deleted
    IncludedFileMoveInput:
      type: object
      properties:
        folderName:
          type: string
          minLength: 1
      required:
        - folderName
    IncludedFileMoveResponse:
      type: object
      properties:
        file:
          $ref: "#/components/schemas/MediaFileRecord"
      required:
        - file
    TrimMediaInput:
      type: object
      properties:
        startSeconds:
          type: number
          minimum: 0
          default: 0
        endSeconds:
          type: number
          exclusiveMinimum: 0
      required:
        - endSeconds
    MediaTrimResponse:
      type: object
      properties:
        fileId:
          type: string
        filename:
          type: string
        sourcePath:
          type: string
        playbackUrl:
          type: string
        duration:
          type: string
      required:
        - fileId
        - filename
        - sourcePath
        - playbackUrl
        - duration
    ComposeMediaInput:
      type: object
      properties:
        fileIds:
          type: array
          minItems: 1
          items:
            type: string
        title:
          type: string
        loopCount:
          type: number
          minimum: 1
          maximum: 12
          default: 1
        logoFileId:
          type: string
        webcamFileId:
          type: string
        logoPosition:
          type: string
          enum: [top-left, top-right, bottom-left, bottom-right]
        webcamPosition:
          type: string
          enum: [top-left, top-right, bottom-left, bottom-right]
        overlayScale:
          type: number
          minimum: 0.1
          maximum: 0.8
          default: 0.25
        webcamScale:
          type: number
          minimum: 0.1
          maximum: 0.8
          default: 0.25
        mainX:
          type: number
          minimum: -48
          maximum: 48
          default: 0
        mainY:
          type: number
          minimum: -48
          maximum: 48
          default: 0
        mainScale:
          type: number
          minimum: 0.5
          maximum: 2.5
          default: 1
        webcamX:
          type: number
          minimum: -48
          maximum: 48
          default: 0
        webcamY:
          type: number
          minimum: -48
          maximum: 48
          default: 0
        animationPreset:
          type: string
          enum: [none, subscribe, like, follow]
          default: none
        outputAspectRatio:
          type: string
          enum: [shorts, full, square]
          default: full
      required:
        - fileIds
    YoutubeDownloadInput:
      type: object
      properties:
        url:
          type: string
          minLength: 1
        quality:
          type: string
          enum: [best, 2160p, 1440p, 1080p, 720p, 480p, 360p, 240p, 144p]
